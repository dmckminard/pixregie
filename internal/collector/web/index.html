<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixregie · debug</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PIXREGIE <span>debug</span></h1>
  <div id="totals"></div>
</header>
<figure id="screen"><img id="shot" alt="Écran du Pi" width="1280" height="720"></figure>
<div class="sortbar muted"><label class="check"><input type="checkbox" id="show-hidden"> Afficher les sessions masquées</label>
  <label>Trier par
  <select id="sort-by">
    <option value="activity">dernière activité</option>
    <option value="started">date de démarrage</option>
  </select></label></div>
<main id="machines"><p class="muted">Chargement…</p></main>
<section id="admin">
  <h2><span>Réglages</span><span id="admin-msg" class="muted" role="status"></span></h2>
  <div class="form">
    <label class="check"><input type="checkbox" id="show-titles"> Afficher les titres de session</label>
    <label>Mise en veille de l'écran sans activité
      <select id="sleep-after">
        <option value="10m">10 min</option><option value="30m">30 min</option>
        <option value="1h">1 h</option><option value="2h">2 h</option>
        <option value="4h">4 h</option><option value="0">jamais</option>
      </select>
    </label>
    <label>Masquer les sessions inactives après
      <select id="idle-hide">
        <option value="30m">30 min</option><option value="1h">1 h</option>
        <option value="4h">4 h</option><option value="12h">12 h</option>
        <option value="24h">24 h</option><option value="168h">7 jours</option>
      </select>
    </label>
    <label>Masquer les sessions figées après
      <select id="stale-hide">
        <option value="30m">30 min</option><option value="1h">1 h</option>
        <option value="4h">4 h</option><option value="12h">12 h</option>
        <option value="24h">24 h</option><option value="168h">7 jours</option>
      </select>
    </label>
  </div>
  <h3>Mise à jour du Pi</h3>
  <div class="form">
    <span id="upgrade-info" class="muted"></span>
    <button type="button" id="upgrade-btn" hidden>Mettre à jour le Pi</button>
  </div>
  <h3>Machines associées</h3>
  <div id="paired"></div>
  <p class="muted small">Ajouter une machine : lance l'app Pixregie dessus, un code s'affiche sur l'écran.
  Ajouter ou retirer un serveur : <code>sudo bash install-pi.sh --add-server</code> / <code>--remove-server</code> sur le Pi.</p>
</section>
<footer><span id="updated" class="muted"></span></footer>
<script src="app.js"></script>
</body>
</html>
