name: release
# A release is published when the VERSION file changes on main (or when a
# v* tag is pushed by hand). The tag is created by the publish job.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; else tag="v$(tr -d ' \n' < VERSION)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Already published (e.g. tag pushed by hand): nothing to do.
          if [ "${GITHUB_REF_TYPE}" != tag ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  linux-windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Windows resources (exe icon, manifest)
        run: |
          go run ./tools/appicon "$RUNNER_TEMP/iconset"
          cd cmd/pixregie-agent
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --manifest gui \
            --icon "$RUNNER_TEMP/iconset/icon_256x256.png" \
            --product-name Pixregie --file-description Pixregie --original-filename Pixregie.exe
      - name: Build
        run: |
          set -eu
          v="${{ needs.version.outputs.tag }}"
          mkdir dist
          build() { # cmd os arch out [goarm] [extra ldflags]
            CGO_ENABLED=0 GOOS=$2 GOARCH=$3 GOARM=${5:-} go build -trimpath \
              -ldflags "-s -w -X main.version=$v ${6:-}" -o "dist/$4" "./cmd/$1"
          }
          build pixregie-display linux arm64 pixregie-display-linux-arm64
          build pixregie-display linux arm pixregie-display-linux-arm 6
          build pixregie-agent linux amd64 pixregie-agent-linux-amd64
          build pixregie-agent linux arm64 pixregie-agent-linux-arm64
          # Tray app: no console window.
          build pixregie-agent windows amd64 Pixregie.exe "" "-H windowsgui"
          cp install/pi/install.sh dist/install-pi.sh
          cp install/server/install.sh dist/install-server.sh
          cp install/mac/install.sh dist/install-mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: dist/*

  macos:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/pixregie-agent
      - run: |
          mkdir dist
          packaging/macos/build-app.sh "${{ needs.version.outputs.tag }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Pixregie-macos.zip

  publish:
    needs: [version, linux-windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: release.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          cd dist && sha256sum * > SHA256SUMS
          # Sign the checksum list with the release key (GitHub secret).
          # Every installer and updater refuses a release whose signature
          # does not verify.
          if [ -z "${SIGNING_KEY}" ]; then echo "RELEASE_SIGNING_KEY secret missing"; exit 1; fi
          umask 077
          printf '%s\n' "${SIGNING_KEY}" > "$RUNNER_TEMP/signing_key"
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/signing_key" -n pixregie-release SHA256SUMS
          rm -f "$RUNNER_TEMP/signing_key"
          printf 'pixregie-release namespaces="pixregie-release" %s\n' "$(cat ../release.pub)" > "$RUNNER_TEMP/allowed"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed" -I pixregie-release -n pixregie-release -s SHA256SUMS.sig < SHA256SUMS
          cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
