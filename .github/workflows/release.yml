name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          set -eu
          v="${GITHUB_REF_NAME}"
          mkdir dist
          build() { # cmd os arch out [goarm] [extra ldflags]
            CGO_ENABLED=0 GOOS=$2 GOARCH=$3 GOARM=${5:-} go build -trimpath \
              -ldflags "-s -w -X main.version=$v ${6:-}" -o "dist/$4" "./cmd/$1"
          }
          build pixregie-display linux arm64 pixregie-display-linux-arm64
          build pixregie-display linux arm pixregie-display-linux-arm 6
          build pixregie-agent linux amd64 pixregie-agent-linux-amd64
          build pixregie-agent linux arm64 pixregie-agent-linux-arm64
          # Tray app: no console window.
          build pixregie-agent windows amd64 Pixregie.exe "" "-H windowsgui"
          cp install/pi/install.sh dist/install-pi.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/pixregie-agent
      - run: |
          mkdir dist
          packaging/macos/build-app.sh "$GITHUB_REF_NAME" dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Pixregie-macos.zip

  publish:
    needs: [linux-windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          cd dist && sha256sum * > SHA256SUMS && cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
